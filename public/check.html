<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Перевірка відео</title>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/common.css">
<style>
body{font-size:18px;min-height:100%;height:auto}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:2.5em 16px 4em;display:flex;flex-direction:column;gap:1.2em}
h1{font-size:clamp(2.4rem,7vw,4rem)}
.rows{display:flex;flex-direction:column;gap:.45em}
.row{display:grid;grid-template-columns:1fr auto;gap:.3em 1em;align-items:center;background:var(--crypt);border-radius:.6em;padding:.75em 1em;border:1.5px solid rgba(239,229,211,.08)}
.row .w{font-weight:800}
.row .k{font-family:var(--mono);font-size:.75em;color:var(--ash);letter-spacing:.06em}
.row .s{grid-row:1/3;grid-column:2;font-weight:600;text-align:right}
.row .why{grid-column:1/3;color:var(--ash);font-size:.85em;line-height:1.45}
.row.ok{border-color:rgba(185,201,163,.5)} .row.ok .s{color:var(--moss)}
.row.bad{border-color:rgba(165,69,75,.6)} .row.bad .s{color:var(--blood)}
.row.wait .s{color:var(--pumpkin)}
/* плеєр має бути на сторінці, щоб грати, але назву ролика не показуємо */
.probe{position:relative;width:320px;height:180px;border-radius:.6em;overflow:hidden;background:#000}
.probe .cover{position:absolute;inset:0;z-index:2;background:radial-gradient(60% 60% at 50% 50%,#2a1a22,#0c070b);display:grid;place-items:center;font-family:var(--mono);font-size:.7em;color:var(--ash);letter-spacing:.1em;text-transform:uppercase}
.probe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.summary{font-weight:800}
</style>
</head>
<body>
<div class="fog"></div>
<div class="wrap">
  <div class="eyebrow">Перед вечіркою</div>
  <h1>Перевірка відео</h1>
  <p class="lead">Перевіряємо кожен фрагмент із блоків «3 секунди жаху» і «Вгадай по саундтреку». Назв фільмів тут немає, лише номери, щоб не було спойлерів. Звук вимкнено.</p>
  <div><button class="btn" id="run">Почати перевірку</button></div>
  <p class="summary" id="summary"></p>
  <div class="rows" id="rows"></div>
  <div class="probe" id="probe" hidden><div id="probeTarget"></div><div class="cover">перевіряємо…</div></div>
</div>
<script src="/js/check.js"></script>
</body>
</html>
